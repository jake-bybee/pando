services:
  pando:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: pando:latest
    container_name: pando
    restart: unless-stopped
    # Share the host's network so the container can use the host's
    # NetBird connection and DNS. The "ports:" block is not needed.
    network_mode: host
    env_file: .env
    environment:
      # Must match the volume mount below, so it overrides .env
      BACKUP_FOLDER_PATH: /backup
    volumes:
      - ./data:/backup:z
    healthcheck:
      # /status is cheap. /health would call Immich every time.
      # If you change LISTEN_PORT in .env, change the port here too.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
