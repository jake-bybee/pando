services:
  pando:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: pando:latest
    container_name: pando
    restart: unless-stopped
    env_file: .env
    environment:
      # Must match the volume mount below, so it overrides .env
      BACKUP_FOLDER_PATH: /backup
    ports:
      - "8080:8080" # change both sides if you change LISTEN_PORT in .env
    volumes:
      - ./data:/backup
    # The container can't look up NetBird names, so give it the IP.
    # Delete this block if IMMICH_URL uses a normal DNS name or an IP.
    extra_hosts:
      - "jake-home-server-235-160.netbird.selfhosted:100.67.235.160"
    healthcheck:
      # /status is cheap. /health would call Immich every time.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
